<html>
    <body>
        <img id="logo" src="img/coder.jpg" alt="" title="coder">
        
        <button onclick="resmiDegistir()">
           Resmi değiştir.
        </button>

       <script>
        function resmiDegistir() {
            var logomuz= document.getElementsById("logo");
            logomuz.title="laptop";
            logomuz.src="img/laptop.jpg";
        }
       </script>

    </body>
</html>
